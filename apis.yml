aid: sabre
name: Sabre
description: Sabre Corporation is a leading technology provider for the global travel
  industry, operating one of the world's largest travel marketplaces through its Global
  Distribution System (GDS). Sabre provides APIs for air shopping, booking, hotel
  reservations, car rentals, rail ticketing, and travel agency workflow automation
  to airlines, hotels, travel agencies, and online travel agencies (OTAs).
