apis:
- aid: sabre:air-booking
  name: Sabre Air Booking API
  description: >-
    Sabre Air Booking API enables flight booking, passenger name record (PNR) creation and management,
    seat selection, ticketing, and booking modification for travel agencies and online travel applications.
    Supports NDC offer booking, ancillary services, and PNR queue management.
  humanURL: https://developer.sabre.com/
  tags:
  - Travel
  - Airlines
  - GDS
  - Booking
  - PNR
  - REST
  properties:
  - type: Documentation
    url: https://developer.sabre.com/
  - type: SDKs
    url: https://github.com/SabreDevStudio/postman-collections
- aid: sabre:cars
  name: Sabre Cars API
  description: >-
    Sabre Cars API provides car rental search, availability, rate shopping, reservation, and management
    APIs for travel agencies and OTAs, connecting to over 40 global car rental brands across 40,000 locations
    through Sabre's GDS distribution.
  humanURL: https://developer.sabre.com/
  tags:
  - Travel
  - Car Rental
  - GDS
  - Booking
  - REST
  properties:
  - type: Documentation
    url: https://developer.sabre.com/
- aid: sabre:destination-content
  name: Sabre Destination Content API
  description: >-
    Sabre Destination Content API provides destination guides, points of interest, geo data, and travel
    inspiration content for travel applications and itinerary planning tools.
  humanURL: https://developer.sabre.com/
  tags:
  - Travel
  - Destination
  - Content
  - REST
  properties:
  - type: Documentation
    url: https://developer.sabre.com/
- aid: sabre:booking-management
  name: Sabre Booking Management API
  description: >-
    Sabre Booking Management API provides unified management of multi-segment travel reservations including
    flights, hotels, and car rentals within a single booking record. Supports booking creation, retrieval,
    modification, and cancellation.
  humanURL: https://developer.sabre.com/docs/rest_apis/trip/orders/booking_management
  tags:
  - Travel
  - Booking
  - GDS
  - REST
  properties:
  - type: Documentation
    url: https://developer.sabre.com/docs/rest_apis/trip/orders/booking_management
- aid: sabre:rail
  name: Sabre Rail API
  description: >-
