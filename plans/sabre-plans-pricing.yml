specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Sabre
providerId: sabre
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Travel
  - GDS
  - Airlines
  - Hotels
  - B2B
description: Sabre is a global distribution system (GDS) and travel technology platform. API access is
  available to airlines, agencies, corporate travel, and hospitality customers under enterprise GDS contracts.
  No public per-call price list, plan tiers, or self-serve sign-up exists; pricing is bundled into the
  GDS / hosting / NDC commercial agreement.
sources:
  - https://developer.sabre.com/
notes: Sabre does not publish API pricing, plan tiers, or per-call rates in its public developer portal.
  Access is gated to contracted Sabre customers, with commercial terms negotiated by the Sabre sales /
  account team. This artifact is intentionally a single Contact Sales plan rather than a fabricated tier.
plans:
  - id: sabre-contact-sales
    name: Contact Sales
    type: enterprise
    description: Contracted GDS / NDC API access for airlines, travel agencies, corporate travel, and
      hospitality customers. Pricing is part of the broader Sabre commercial relationship (transaction
      / segment fees, hosting, professional services).
    entries:
      - label: Contracted API Access
        name: contracted_access
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Sabre Air Shopping / Pricing / Booking APIs
      - name: Sabre Hospitality Solutions APIs
      - name: Sabre Car / Rail / Cruise content
      - name: NDC content via Sabre
      - name: Sabre Profiles, Mid-Office, and PNR APIs
      - name: Access bundled into GDS / hosting commercial agreement
maintainers:
