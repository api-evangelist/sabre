specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Sabre
providerId: sabre
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Travel
  - GDS
  - B2B
  - Rate Limiting
description: Sabre does not publish API rate limits in any public developer surface. Throughput is governed
  per-PCC (Pseudo City Code) and per-contract by the GDS sizing model, with separate limits per service
  family (shopping, pricing, booking). This artifact is intentionally a Contact Sales placeholder until
  Sabre publishes numeric throttles or shares them under contract.
sources:
  - https://developer.sabre.com/
notes: Public docs do not expose per-second / per-minute throttle numbers. Contracted customers receive
  per-PCC throughput targets via their account team.
limits:
  - name: Contracted API throttling
    scope: account
    metric: varies
    limit: contact sales / per-PCC and per-service
    notes: Sabre throttles per Pseudo City Code, per service family, and per contract. Numeric values
      are not public.
policies:
  - name: Per-PCC throttling
    description: Sabre traffic is shaped per Pseudo City Code; behavior under load and recovery characteristics
      depend on service family (shopping vs booking vs PNR).
  - name: Contracted Sales engagement
    description: Production limits are confirmed by the Sabre account team; clients should not rely on
      defaults or third-party numbers.
maintainers:
