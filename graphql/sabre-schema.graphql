# ─── Root Operations ──────────────────────────────────────────────────────────

type Query {
  """Retrieve a PNR by record locator."""
  pnr(pnrCode: ID!): PNR

  """Search for available flights."""
  flightOffers(
    origin: IATA!
    destination: IATA!
    departureDate: Date!
    returnDate: Date
    passengers: [PassengerInput!]!
    cabin: CabinClass
    maxResults: Int
  ): [FlightOffer!]

  """Get seat map for a specific flight."""
  seatMap(
    flightNumber: String!
    origin: IATA!
    destination: IATA!
    departureDate: Date!
    cabin: CabinClass!
  ): SeatMap

  """Get air availability for a flight."""
  airAvailability(
    origin: IATA!
    destination: IATA!
    departureDate: Date!
    airline: IATA
  ): [AirAvailability!]

  """Search for hotels."""
  hotelRates(
    cityCode: String
    latitude: Float
    longitude: Float
    radiusKm: Float
    checkIn: Date!
    checkOut: Date!
    roomCount: Int!
    guestCount: Int!
  ): [HotelRates!]

  """Get hotel details."""
  hotel(hotelId: ID!): Hotel

  """Search for car rentals."""
  carRates(
    pickupLocation: String!
    dropoffLocation: String!
    pickupDateTime: DateTime!
    dropoffDateTime: DateTime!
    driverAge: Int
  ): CarRates

  """Retrieve a booking by ID."""
  booking(bookingId: ID!): Booking

  """Get fare rules for a specific fare."""
  fareRules(fareBasis: String!, origin: IATA!, destination: IATA!, carrier: IATA!): FareRules

  """Get airport details."""
  airport(code: IATA!): AirportDetails

  """Get airline details."""
  airline(code: IATA!): AirlineDetails

  """Get flight schedules between two airports."""
  schedules(origin: IATA!, destination: IATA!, date: Date!): [Schedule!]

  """Get queue details."""
  queue(queueId: ID!, ipcc: String!): Queue

  """Get a traveler profile."""
  profile(profileId: ID!): Profile

  """Get session information."""
  session(sessionId: ID!): Session
}

type Mutation {
  """Create a new booking/PNR."""
  createBooking(input: CreateBookingInput!): Booking

  """Cancel a booking."""
  cancelBooking(bookingId: ID!, reason: String): Booking

  """Update a booking."""
  updateBooking(bookingId: ID!, input: UpdateBookingInput!): Booking

  """Issue tickets for a booking."""
  issueTickets(bookingId: ID!, paymentMethod: PaymentMethodInput!): [TicketDetails!]

  """Void a ticket."""
  voidTicket(ticketNumber: String!, reason: String): TicketDetails

  """Add ancillary service to a booking."""
  addAncillaryService(bookingId: ID!, service: AncillaryServiceInput!): AncillaryService

  """Assign a seat."""
  assignSeat(bookingId: ID!, passengerId: ID!, segmentId: ID!, seatNumber: String!): SeatDetails

  """Obtain an OAuth token."""
  authenticate(clientId: String!, clientSecret: String!, grantType: String!): Token

  """Create a Sabre session."""
  createSession(credentials: SessionCredentialsInput!): Session

  """Close a Sabre session."""
  closeSession(sessionId: ID!): Boolean

  """Move a PNR to a queue."""
  queuePNR(pnrCode: ID!, queueId: ID!, category: QueueCategory): Queue

  """Create a traveler profile."""
  createProfile(input: ProfileInput!): Profile

  """Update a traveler profile."""
  updateProfile(profileId: ID!, input: ProfileInput!): Profile

  """Create an EMD."""
  createEMD(bookingId: ID!, serviceId: ID!, paymentMethod: PaymentMethodInput!): EMD
}

# ─── Input Types ──────────────────────────────────────────────────────────────

input PassengerInput {
  type: PassengerType!
  count: Int!
}

input CreateBookingInput {
  offerId: ID!
  passengers: [PassengerDataInput!]!
  contactInfo: ContactInfoInput!
  paymentMethod: PaymentMethodInput
  remarks: [String!]
}

input PassengerDataInput {
  type: PassengerType!
  firstName: String!
  lastName: String!
  dateOfBirth: Date
  gender: String
  documentNumber: String
  documentType: DocumentType
  documentExpiry: Date
  issuingCountry: String
  frequentFlyerNumber: String
  frequentFlyerProgram: IATA
}

input ContactInfoInput {
  email: String!
  phone: String!
  address: AddressInput
}

input AddressInput {
  street: String
  city: String!
  state: String
  postalCode: String
  country: String!
}

input PaymentMethodInput {
  type: String!
  cardNumber: String
  cardHolder: String
  expiryDate: String
  cvv: String
  billingAddress: AddressInput
}

input UpdateBookingInput {
  contactInfo: ContactInfoInput
  remarks: [String!]
  specialRequests: [String!]
}

input AncillaryServiceInput {
  serviceCode: String!
  subCode: String
  segmentId: ID
  passengerId: ID!
  quantity: Int!
}

input SessionCredentialsInput {
  username: String!
  password: String!
  ipcc: String!
  domain: String
}

input ProfileInput {
  firstName: String
  lastName: String
  companyName: String
  contact: ContactInfoInput!
  documents: [DocumentInput!]
  frequentFlyer: [FrequentFlyerInput!]
}

input DocumentInput {
  type: DocumentType!
  number: String!
  issuingCountry: String!
  expiryDate: Date!
  nationality: String
  issueDate: Date
}

input FrequentFlyerInput {
  programCode: IATA!
  memberNumber: String!
}
