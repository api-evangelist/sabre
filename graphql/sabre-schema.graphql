}

"""Extended segment information including equipment and stops."""
type SegmentDetails {
  segmentId: ID!
  airline: Airline!
  operatingCarrier: Airline
  flightNumber: String!
  operatingFlightNumber: String
  origin: Airport!
  destination: Airport!
  departureTerminal: String
  arrivalTerminal: String
  departureDateTime: DateTime!
  arrivalDateTime: DateTime!
  cabin: CabinClass!
  bookingClass: String!
