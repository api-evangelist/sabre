"""
Sabre GDS Travel Platform - Conceptual GraphQL Schema
Derived from Sabre developer documentation at https://developer.sabre.com/
Covers air shopping, booking, hotel, car rental, ticketing, and agency workflow domains.
"""

# ─── Scalars ─────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar Time
scalar Currency
scalar IATA  # 2-letter airline or 3-letter airport code

# ─── Enumerations ────────────────────────────────────────────────────────────

enum PNRStatus {
  ACTIVE
  CANCELLED
  TICKETED
  VOIDED
  REFUNDED
  EXPIRED
  QUEUED
}

enum BookingStatus {
  PENDING
  CONFIRMED
  CANCELLED
  ON_HOLD
  WAITLISTED
  TICKETED
  COMPLETED
}

enum TicketStatus {
  ISSUED
  VOIDED
  REFUNDED
  EXCHANGED
  OPEN
  USED
  EXPIRED
  SUSPENDED
}

enum CabinClass {
  FIRST
  BUSINESS
  PREMIUM_ECONOMY
  ECONOMY
}

enum PassengerType {
  ADT
  CHD
  INF
  INS
  UNN
  SRC
  MIL
}

enum DocumentType {
  PASSPORT
  VISA
  NATIONAL_ID
  DRIVERS_LICENSE
  REDRESS_NUMBER
  KNOWN_TRAVELER
}

enum ServiceStatus {
  AVAILABLE
  CONFIRMED
  CANCELLED
  REQUESTED
  FLOWN
}

enum PaymentStatus {
  PENDING
  AUTHORIZED
  CAPTURED
  REFUNDED
  DECLINED
  VOIDED
}

enum SeatLocation {
  WINDOW
  MIDDLE
  AISLE
}

enum SeatFeature {
  EXTRA_LEGROOM
  BULKHEAD
  EXIT_ROW
  BASSINET
  RECLINE_RESTRICTED
  PREFERRED
}

enum CarCategory {
  MINI
  ECONOMY
  COMPACT
  MIDSIZE
  STANDARD
  FULLSIZE
  PREMIUM
  LUXURY
  SUV
  VAN
  TRUCK
  CONVERTIBLE
}

enum CarTransmission {
  AUTOMATIC
  MANUAL
}

enum QueueCategory {
  GENERAL
  TICKETING
  SCHEDULE_CHANGE
  REFUND
  GROUP
  WAITLIST
}

# ─── Session & Authentication ─────────────────────────────────────────────────

"""API credential used to authenticate with Sabre services."""
type APIKey {
  keyId: ID!
  name: String!
  clientId: String!
  environment: String!
  created: DateTime!
  expires: DateTime
  scopes: [String!]!
  active: Boolean!
}

"""OAuth 2.0 access token for Sabre REST API calls."""
type Token {
  accessToken: String!
  tokenType: String!
  expiresIn: Int!
  issuedAt: DateTime!
  expiresAt: DateTime!
  scope: String
}

"""Sabre stateful session reference (legacy SOAP session compatibility)."""
type Session {
  sessionId: ID!
  token: SessionToken!
  agentSine: String
  ipcc: String
  createdAt: DateTime!
  expiresAt: DateTime!
  active: Boolean!
}

"""Session-scoped authentication token for Sabre GDS sessions."""
type SessionToken {
  binarySecurityToken: String!
  created: DateTime!
  expires: DateTime!
  sessionId: ID!
}

# ─── Airport & Airline Reference ──────────────────────────────────────────────

"""Airport reference with IATA code and basic metadata."""
type Airport {
  code: IATA!
  details: AirportDetails
}

"""Full airport information including location and facilities."""
type AirportDetails {
  code: IATA!
  name: String!
  city: String!
  cityCode: String!
  country: String!
  countryCode: String!
  latitude: Float
  longitude: Float
  timezone: String
  terminals: [String!]
  international: Boolean!
}

"""Airline carrier reference with IATA code."""
type Airline {
  code: IATA!
  details: AirlineDetails
}

"""Full airline information including alliance and contact details."""
type AirlineDetails {
  code: IATA!
  name: String!
  accountingCode: String
  allianceName: String
  country: String
  website: String
  baggagePolicy: String
  freqFlyerProgram: String
}

# ─── Schedule ────────────────────────────────────────────────────────────────

"""Flight schedule reference."""
type Schedule {
  scheduleId: ID!
  details: ScheduleDetails
}

"""Complete flight schedule data for a route."""
type ScheduleDetails {
  scheduleId: ID!
  origin: Airport!
  destination: Airport!
  airline: Airline!
  flightNumber: String!
  departureDays: [String!]!
  departureTime: Time!
  arrivalTime: Time!
  duration: Int!
  effectiveDate: Date!
  discontinueDate: Date
  equipment: String
  stops: Int!
}

# ─── Fare ────────────────────────────────────────────────────────────────────

"""Fare basis code definition."""
type FareBasis {
  code: String!
  cabin: CabinClass!
  airline: IATA!
  description: String
  bookingClass: String!
  fareType: String
}

"""Conditions and restrictions associated with a fare."""
type FareRules {
  fareRuleId: ID!
  fareBasis: FareBasis!
  advance_purchase: String
  minStay: String
  maxStay: String
  penalties: [String!]
  refundable: Boolean!
  changeable: Boolean!
  combinability: String
  blackoutDates: [Date!]
}

"""Base fare object with amount and currency."""
type Fare {
  fareId: ID!
  baseFare: Float!
  currency: Currency!
  taxes: Float!
  totalFare: Float!
  fareBasis: FareBasis!
  details: FareDetails
}

"""Complete fare breakdown including all surcharges and fees."""
type FareDetails {
  fareId: ID!
  baseFare: Float!
  currency: Currency!
  taxes: Float!
  surcharges: Float!
  totalFare: Float!
  fareBreakdown: [FareComponent!]
  fareBasis: FareBasis!
  fareRules: FareRules
  validatingCarrier: IATA!
  privateFare: Boolean!
  negotiatedFare: Boolean!
}

"""Individual component of a fare breakdown."""
type FareComponent {
  type: String!
  amount: Float!
  currency: Currency!
  description: String
}

# ─── Flight & Availability ────────────────────────────────────────────────────

"""Individual flight leg within an itinerary."""
type FlightSegment {
  segmentId: ID!
  airline: Airline!
  flightNumber: String!
  origin: Airport!
  destination: Airport!
  departureDateTime: DateTime!
  arrivalDateTime: DateTime!
  cabin: CabinClass!
  bookingClass: String!
  duration: Int!
