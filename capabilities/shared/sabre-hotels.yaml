naftiko: "1.0.0-alpha1"

info:
  label: "Sabre Hotels API"
  description: "Hotel search, availability, rate shopping, and booking API accessing Sabre's global lodging content and SynXis hotel distribution."
  tags:
    - Travel
    - Hotels
    - GDS
    - Booking
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SABRE_ACCESS_TOKEN: SABRE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: sabre-hotels
      baseUri: https://api.sabre.com
      description: "Sabre Hotels API for search and booking"
      authentication:
        type: bearer
        token: "{{SABRE_ACCESS_TOKEN}}"
      resources:
        - name: hotel-search
          path: /v2.0.0/offers/hotels
          description: "Hotel availability search"
          operations:
            - name: search-hotel-availability
              method: POST
              description: "Search available hotels with rates and availability"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  CheckIn: "{{tools.check_in}}"
                  CheckOut: "{{tools.check_out}}"
                  GeoSearch: "{{tools.geo_search}}"

        - name: hotel-rates
          path: /v2.0.0/offers/hotels/{hotelCode}/rates
          description: "Hotel room rates"
          operations:
            - name: get-hotel-rates
              method: GET
              description: "Get room rates for a specific hotel"
              inputParameters:
                - name: hotelCode
                  in: path
                  type: string
                  required: true
                  description: "Sabre hotel property code"
                - name: checkIn
                  in: query
                  type: string
                  required: true
                  description: "Check-in date (YYYY-MM-DD)"
                - name: checkOut
                  in: query
                  type: string
                  required: true
                  description: "Check-out date (YYYY-MM-DD)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: hotel-reservations
          path: /v2.0.0/hotels/reservations
          description: "Hotel reservation management"
          operations:
            - name: create-hotel-reservation
              method: POST
              description: "Book a hotel room and create a reservation"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  HotelCode: "{{tools.hotel_code}}"
                  RoomTypeCode: "{{tools.room_type_code}}"
                  CheckIn: "{{tools.check_in}}"
                  CheckOut: "{{tools.check_out}}"
                  GuestInfo: "{{tools.guest_info}}"

        - name: hotel-reservation-detail
          path: /v2.0.0/hotels/reservations/{confirmationId}
          description: "Individual reservation management"
          operations:
            - name: get-hotel-reservation
              method: GET
              description: "Retrieve hotel reservation details"
              inputParameters:
                - name: confirmationId
                  in: path
                  type: string
                  required: true
                  description: "Reservation confirmation number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: cancel-hotel-reservation
              method: DELETE
              description: "Cancel a hotel reservation"
              inputParameters:
                - name: confirmationId
                  in: path
                  type: string
                  required: true
                  description: "Reservation confirmation number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: sabre-hotels-rest
      resources:
        - path: /v1/hotels/search
          name: hotel-search
          operations:
            - method: POST
              name: search-hotel-availability
              description: "Search hotel availability"
              call: "sabre-hotels.search-hotel-availability"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/hotels/reservations
          name: hotel-reservations
          operations:
            - method: POST
              name: create-hotel-reservation
              description: "Create hotel reservation"
              call: "sabre-hotels.create-hotel-reservation"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: sabre-hotels-mcp
      transport: http
      tools:
        - name: search-hotels
          description: "Search available hotels with rates"
          hints:
            readOnly: true
            openWorld: true
          call: "sabre-hotels.search-hotel-availability"
          outputParameters:
            - type: object
              mapping: "$."
        - name: book-hotel
          description: "Book a hotel room reservation"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "sabre-hotels.create-hotel-reservation"
          outputParameters:
            - type: object
              mapping: "$."
