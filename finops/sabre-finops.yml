description: 'FOCUS-aligned FinOps placeholder for Sabre: GDS / NDC API access is sold under enterprise
  contracts with no public unit pricing or invoice schema. Meters and FOCUS columns reflect a contracted-spend
  posture rather than usage-based billing.'
