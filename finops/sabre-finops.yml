principles:
  - name: Visibility
    description: Visibility comes from Sabre's contracted reporting (segment / booking statements, PCC
      activity reports). Combine those with internal app-side telemetry to attribute API consumption.
  - name: Allocation
    description: Allocate by PCC, agency branch, line of business, or product (air / hotel / car), aligned
      to the Sabre contract's billing dimensions.
  - name: Optimization
    description: Optimize shopping-to-booking conversion, cache low-volatility content where contractually
      permitted, and consolidate PCCs where billing dimensions align to reduce contracted minimums.
  - name: Accountability
    description: Operations and procurement jointly own the Sabre contract; reconcile segment / booking
      meters against monthly statements and review at contract renewal.
